# Radar Pro — researcher persona

title = "Research Radar"
topic = "foundational agent and memory research"
watch_terms = ["memory", "reasoning", "benchmarks", "retrieval", "planning"]
output_path = "briefs/research.md"
max_items = 8
sources = ["arxiv", "hackernews"]
connector_timeout_seconds = 20
memory_path = ".radar/research-memory.json"

[schedule]
preset = "daily"
at = "06:00"

[synthesis]
provider = "anthropic"
model = "claude-3-5-haiku-latest"
timeout_seconds = 60
min_source_families = 2
