name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Smoke test agent-handoff entry point
        run: |
          agent-handoff --help
          agent-handoff baseline run --help
          agent-handoff report generate --help

      - name: Run sample baseline
        run: |
          agent-handoff baseline run --config scenarios/support-agent/scenarios.yaml

      - name: Run tests
        run: python -m pytest -q
